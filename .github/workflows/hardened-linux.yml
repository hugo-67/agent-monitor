name: Hardened Ubuntu Packages

on:
  push:
    branches:
      - security/hardened-ubuntu-appimage-20261013
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Validate Ubuntu setup helper syntax
        run: bash -n scripts/setup-ubuntu-appimage.sh
      - name: Unit and regression tests
        env:
          AGENT_MONITOR_POLLING: '1'
        run: npm test
      - name: Build
        run: npm run build
      - name: Package AppImage and Ubuntu DEB
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Inspect packaged sandbox protections
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release/*.AppImage)
          test "${#images[@]}" -eq 1
          node scripts/check-appimage-security.mjs "${images[0]}"
          debs=(release/*.deb)
          test "${#debs[@]}" -eq 1
          node scripts/check-deb-security.mjs "${debs[0]}"
          ( cd release && sha256sum -- *.AppImage *.deb > SHA256SUMS.txt )
      - name: Upload hardened Ubuntu installers and checksums
        uses: actions/upload-artifact@v4
        with:
          name: hardened-agent-monitor-ubuntu-x64
          if-no-files-found: error
          retention-days: 90
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
            scripts/setup-ubuntu-appimage.sh
      - name: Publish hardened pre-release for direct download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ubuntu-sandbox-fix-20261013"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.AppImage release/*.deb release/SHA256SUMS.txt scripts/setup-ubuntu-appimage.sh --clobber
          else
            gh release create "$tag" release/*.AppImage release/*.deb release/SHA256SUMS.txt scripts/setup-ubuntu-appimage.sh \
              --target "$(git rev-parse HEAD)" \
              --title "Agent Monitor Ubuntu sandbox compatibility fix" \
              --notes "Fix for Ubuntu 24.04+ sandbox startup: install the .deb using sudo apt install ./agent-monitor-*.deb (recommended: bundled per-app AppArmor profile) OR configure an existing AppImage using bash setup-ubuntu-appimage.sh /absolute/path/to/the.AppImage. No global security relaxation or Chromium sandbox bypass. See docs/development.md." \
              --prerelease
          fi
