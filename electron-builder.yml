appId: com.donvito.agentmonitor
productName: Agent Monitor
copyright: Copyright © 2026 Melvin Vivas

directories:
  # Vite already writes the renderer to dist/.
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"

# The main process loads this at runtime for the window icon.
extraResources:
  - from: build/icon.png
    to: icon.png

artifactName: "${name}-${version}-${os}-${arch}.${ext}"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID certificate: ad-hoc sign so Apple Silicon does not report the app as damaged.
  identity: "-"
  # Hardened runtime only matters for notarization and breaks ad-hoc signed launches.
  hardenedRuntime: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  maintainer: "hugo-67 <320913724+hugo-67@users.noreply.github.com>"
  category: Development
  executableName: agent-monitor
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# Ubuntu 24.04+ supports per-app user namespace AppArmor permissions.
deb:
  appArmorProfile: build/apparmor-profile

# Override electron-builder v26's unsafe default .desktop Exec=AppRun --no-sandbox.
# The AppImage runtime may still append --no-sandbox on systems where user
# namespaces are blocked; src/main/security.ts makes that a startup error.
appImage:
  executableArgs:
    - --disable-setuid-sandbox
